      Content Security Policy.

      Hardened (vs typical default):
        • No 'unsafe-eval'  — blocks eval() / new Function() / setTimeout("string").
        • No 'unsafe-inline' on script-src — arbitrary <script>…</script> from XSS is rejected.
          Our single legitimate inline loader (analytics deferral, see below) is whitelisted by
          its sha256 hash. <script type="application/ld+json"> is data, not code, so it doesn't
          need a hash.
        • object-src 'none', base-uri 'self', form-action 'self', frame-ancestors restricted.
        • upgrade-insecure-requests forces http subresources to https.

      Note about 'strict-dynamic':
        strict-dynamic requires either a per-response nonce or a hash on EVERY <script src=…>.
        Lovable hosting serves static HTML with no server-side templating, so per-request
        nonces aren't possible. Hash-based CSP without strict-dynamic is the strongest option
        available here and already neutralises arbitrary <script> injection.

      If you change the inline analytics loader below, regenerate its hash:
        node -e "let s=require('fs').readFileSync('index.html','utf8').match(/<script>([\\s\\S]*?)<\\/script>/)[1];console.log('sha256-'+require('crypto').createHash('sha256').update(s).digest('base64'))"
